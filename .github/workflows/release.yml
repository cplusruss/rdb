name: release
on: workflow_dispatch
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements.txt pyinstaller==6.13.0
      - name: Read version
        run: |
          $line = Select-String -Path src\rdb_version.py -Pattern '^VERSION = "(\d+\.\d+\.\d+)"$'
          if (-not $line) { throw "VERSION not found in src\rdb_version.py" }
          "VERSION=$($line.Matches[0].Groups[1].Value)" >> $env:GITHUB_ENV
      - name: Fail if the release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $out = gh release view "v$env:VERSION" 2>&1
          if ($LASTEXITCODE -eq 0) { throw "release v$env:VERSION already exists" }
          if ("$out" -notmatch 'release not found') { throw "gh release view failed: $out" }
          exit 0
      - name: Build
        shell: cmd
        run: |
          set PY=python
          set OUT=%RUNNER_TEMP%\rdb-build
          call build_exe.bat
          if errorlevel 1 exit /b 1
      - name: Check the exe bundles every imported module
        run: |
          python .github\check_bundle.py
          if ($LASTEXITCODE -ne 0) { throw "bundle check failed" }
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v$env:VERSION" dist\rdb.exe --title "rdb $env:VERSION"
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
